[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-guardrail"
version = "0.1.0"
description = "A policy proxy for MCP tool calls: allowlist, argument rules, human approval, JSONL audit log."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Oğuzhan Balım" }]
dependencies = ["mcp>=2.3,<3", "pyyaml>=6", "anyio>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mcp-guardrail = "mcp_guardrail.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_guardrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
